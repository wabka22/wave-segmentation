name: ECG Segmentation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  train-and-predict:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install numpy matplotlib tqdm scikit-learn

          # если есть requirements.txt:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify project structure
        run: |
          ls -la
          test -f train.py
          test -f predict.py

      - name: Train model
        run: |
          python train.py

      - name: Check checkpoint
        run: |
          ls checkpoints
          test -f checkpoints/last_model.pth

      - name: Run prediction
        run: |
          python predict.py

      - name: Upload model checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: ecg-model
          path: checkpoints/

      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: ecg-predictions
          path: data/data_with_spikes/prediction_markin/

      - name: Upload plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecg-plots
          path: |
            *.png
            *.jpg
            *.jpeg